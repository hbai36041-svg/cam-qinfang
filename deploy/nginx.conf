# Alternative to Caddy, for servers that already run Nginx (certificates via certbot or the cloud console).
server {
    listen 80;
    server_name qinfang.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name qinfang.example.com;
    ssl_certificate     /etc/letsencrypt/live/qinfang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qinfang.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 3m;   # caption audio uploads

    # Signalling stream (Server-Sent Events): never buffer, never time out
    location ~ ^/api/rooms/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
