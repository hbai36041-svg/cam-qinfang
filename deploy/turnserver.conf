# coturn for CAM线上琴房. Secret, realm, external IP and certs are passed on the command line
# (see docker-compose.yml) so this file holds no secrets.
listening-port=3478
tls-listening-port=5349
# Relay range — open these UDP ports in the cloud firewall / security group
min-port=49160
max-port=49400

use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
stale-nonce=600
total-quota=200
user-quota=20
# Do not let the relay be used to reach private networks
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
log-file=stdout
simple-log
