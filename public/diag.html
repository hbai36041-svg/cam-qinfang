<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络诊断 · CAM线上琴房</title>
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .diag { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  .diag h1 { font: 600 24px var(--serif); letter-spacing: .1em; margin: 18px 0 4px; }
  .diag table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14px; }
  .diag td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .diag td:first-child { color: var(--muted); width: 46%; }
  .ok { color: var(--ok); } .bad { color: var(--danger); } .warn { color: var(--warn); }
  textarea { width: 100%; min-height: 160px; background: rgba(5,13,26,.6); color: var(--ice-200); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 12px/1.5 var(--mono); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="diag">
  <a href="/"><img class="logo-small" src="/assets/logo.png" alt="夏空"></a>
  <h1>网络诊断 · Диагностика сети · Network check</h1>
  <p class="hint">在中国或俄罗斯的电脑/手机上打开本页，点击“开始”，完成后把结果复制发给管理员。<br>
    Откройте страницу в России, нажмите «Старт» и отправьте результат администратору.<br>
    Run this from the student's/professor's real network and send the report to the administrator.</p>
  <div class="row"><button class="btn primary" id="run">开始 · Старт · Start</button>
  <button class="btn ghost" id="copy">复制结果 · Копировать · Copy</button></div>
  <table id="out"></table>
  <textarea id="report" readonly></textarea>
</main>
<script type="module" src="/js/diag.js"></script>
</body>
</html>
